<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das tägliche Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#efe5d2;--paper:#f8f1e3;--ink:#2e2218;--mute:#7a6652;--rule:#d8c7a8;--olive:#59602f;--olive-ink:#f8f1e3;--clay:#a9492a;--sand:#e4d3b3;
--head:'Fraunces',Georgia,serif;--body:'Source Serif 4',Georgia,serif;--ui:'Instrument Sans',system-ui,sans-serif;--gap:48px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2d231a;--paper:#3a2d21;--ink:#efe4d0;--mute:#b9a38a;--rule:#56452f;--olive:#b3ba72;--olive-ink:#2a2018;--clay:#e69468;--sand:#4b3b2b}}
:root[data-theme="dark"]{--bg:#2d231a;--paper:#3a2d21;--ink:#efe4d0;--mute:#b9a38a;--rule:#56452f;--olive:#b3ba72;--olive-ink:#2a2018;--clay:#e69468;--sand:#4b3b2b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.62 var(--body);display:flex;flex-direction:column;overflow:hidden;height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.mast{padding:14px 20px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px double var(--ink)}
.mast h1{font:700 clamp(26px,5vw,42px)/1 var(--head);margin:0;letter-spacing:-.01em}
.mast small{display:block;font:400 13px var(--ui);color:var(--mute);margin-top:6px}
.tools{display:flex;gap:8px;position:relative}
.ib{font:600 13px var(--ui);padding:8px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--paper)}
.ib:hover{border-color:var(--olive)}
.cal{position:absolute;right:0;top:44px;z-index:20;background:var(--paper);border:1px solid var(--ink);padding:12px;width:268px;box-shadow:6px 6px 0 var(--sand)}
.cal h4{margin:0 0 8px;font:600 15px var(--head);display:flex;justify-content:space-between}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font:13px var(--ui)}
.cal .g span{color:var(--mute);padding:3px 0}
.cal .d{aspect-ratio:1;border-radius:50%;color:var(--mute);opacity:.45}
.cal .d.has{opacity:1;color:var(--ink);font-weight:600;background:var(--sand)}
.cal .d.sel{background:var(--olive);color:var(--olive-ink)}
.cal p{margin:8px 0 0;font:12px var(--ui);color:var(--mute)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 20px;border-bottom:1px solid var(--rule);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:600 14px var(--ui);padding:7px 14px;border-radius:999px;white-space:nowrap;color:var(--mute)}
nav button:hover{color:var(--ink)}
nav button[aria-current=true]{background:var(--olive);color:var(--olive-ink)}
.wrap{flex:1;min-height:0;padding:18px 20px 0}
#pages{height:100%;position:relative;overflow-x:auto;overflow-y:hidden;columns:1;column-gap:var(--gap);column-fill:auto;scrollbar-width:none}
#pages::-webkit-scrollbar{display:none}
@media(min-width:860px){#pages{columns:2;--gap:64px}.wrap{width:100%;max-width:1120px;margin:0 auto}body{font-size:18px}}
@media(max-width:600px){.mast{padding:10px 14px 6px;align-items:center}.mast h1{font-size:24px}.mast small{font-size:12px;margin-top:4px}.wrap{padding:12px 16px 0}nav{padding:6px 14px}.topic{font-size:26px}body{font-size:16.5px}.hd h3{font-size:19.5px}.ib{padding:7px 10px}}
.topic{font:700 30px/1.1 var(--head);margin:6px 0 14px;padding-top:6px;border-top:4px solid var(--olive);break-after:avoid}
.brief{background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--clay);padding:14px 18px;margin-bottom:22px;break-inside:avoid}
.brief h2{font:700 22px var(--head);margin:0 0 8px}
.brief ol{margin:0;padding-left:20px}.brief li{margin:5px 0;font-size:15.5px;line-height:1.5}
.brief a{color:inherit;text-decoration-color:var(--clay);text-underline-offset:3px;cursor:pointer}
.note{font:13px/1.5 var(--ui);color:var(--mute);margin:0 0 18px;break-inside:avoid}
.a{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--rule)}.sub{break-inside:avoid;break-after:avoid}.hd{break-inside:avoid}.body p{orphans:3;widows:3}.more{break-before:avoid}
.sub{font:600 12.5px var(--ui);color:var(--clay);margin-bottom:3px}
.hd{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;text-align:left;width:100%;padding:0}
.hd h3{font:700 21px/1.25 var(--head);margin:0}
.hd:hover h3{color:var(--olive)}
.chev{flex:none;width:26px;height:26px;border:1px solid var(--rule);border-radius:50%;display:grid;place-items:center;font:16px var(--ui);color:var(--mute);transition:transform .2s}
.hd[aria-expanded=true] .chev{transform:rotate(45deg);background:var(--olive);color:var(--olive-ink);border-color:var(--olive)}
.body p{margin:10px 0 0}
.meta{font:13px var(--ui);color:var(--mute)}
.unc{font:600 11.5px var(--ui);color:var(--clay);border:1px solid var(--clay);border-radius:4px;padding:1px 6px;margin-left:6px}
.more{margin-top:10px;padding:0;font:600 13.5px var(--ui);color:var(--olive);text-decoration:underline;text-underline-offset:3px}
.long{border-left:3px solid var(--sand);padding-left:14px;margin-top:6px}
.sol{margin-top:10px;font:600 13.5px var(--ui);padding:7px 14px;border:1px solid var(--olive);border-radius:999px;color:var(--olive)}
.foot{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--rule);font:13px var(--ui);color:var(--mute)}
.foot button{font:600 14px var(--ui);padding:8px 16px;border:1px solid var(--ink);border-radius:999px}
.foot button:disabled{opacity:.3;cursor:default}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="mast">
  <div><h1>Das tägliche Briefing</h1><small id="stamp"></small></div>
  <div class="tools">
    <button class="ib" id="dbtn" aria-haspopup="true" aria-expanded="false"></button>
    <button class="ib" id="tbtn" aria-label="Dunkelmodus umschalten">Hell/Dunkel</button>
    <div class="cal" id="cal" hidden></div>
  </div>
</header>
<nav id="tabs" aria-label="Themen"></nav>
<div class="wrap"><main id="pages" tabindex="0" aria-label="Briefing"></main></div>
<footer class="foot"><button id="prev">Zurück</button><span id="pg"></span><button id="next">Weiter</button></footer>

<script>
// Beispieldaten im geplanten Tagesformat: Vibe liefert pro Tag nur diese Struktur.
const DAY={date:"2026-11-22",created:"06:02",window:"21.11., 06:00 bis 22.11., 06:00",
available:[15,16,17,18,19,20,21,22],
topics:[
{id:"politik",name:"Politik",items:[
 {sub:"Deutschland",h:"Beispielmeldung: Bundestag berät über Haushaltsentwurf",s:"Die Abgeordneten debattieren den Entwurf in erster Lesung. Strittig sind vor allem die Ausgaben für Infrastruktur.",l:"Hier steht in der echten Ausgabe der ausführliche Hintergrund: Vorgeschichte, Positionen der Fraktionen und der weitere Zeitplan bis zur Abstimmung.",src:"Beispielquelle A",t:"05:40"},
 {sub:"International",h:"Beispielmeldung: Gipfeltreffen endet mit gemeinsamer Erklärung",s:"Die Teilnehmer einigen sich auf ein knappes Abschlusspapier. Details zur Umsetzung bleiben offen.",l:"Der Langtext ordnet ein, was die Erklärung verbindlich macht und was nur Absichtserklärung ist.",src:"Beispielquelle B",t:"04:15",unc:1}]},
{id:"wirtschaft",name:"Wirtschaft",items:[
 {sub:"Märkte und Konjunktur",h:"Beispielmeldung: Leitindizes schließen leicht im Plus",s:"Der Handel verlief ruhig. Anleger warten auf neue Konjunkturdaten in der kommenden Woche.",l:"Der Hintergrund erklärt, welche Daten anstehen und warum sie für die Zinserwartungen wichtig sind.",src:"Beispielquelle C",t:"22:10"},
 {sub:"Aktien allgemein",h:"Beispielmeldung: Was die Börsenwoche bewegt hat",s:"Kurzer Rückblick auf die Gewinner und Verlierer der Woche und die Gründe dahinter.",l:"Hier folgt eine Einordnung nach Branchen, mit Verweis auf die Quartalszahlen der größten Werte.",src:"Beispielquelle C",t:"21:30"},
 {sub:"Die 5 weltweit größten Aktien",h:"Beispielrangliste: Top 5 nach Börsenwert",s:"Platz 1 bis 5 mit Börsenwert und Tagesveränderung. In der echten Ausgabe stehen hier die aktuellen Werte, hier nur Platzhalter.",l:"Der Langtext nennt Verschiebungen im Ranking seit dem Vortag und die wichtigsten Treiber.",src:"Beispielquelle D",t:"22:00"},
 {sub:"Anthropic",h:"Beispielmeldung: Neues zu Anthropic",s:"Hier erscheinen Unternehmensmeldungen zu Anthropic aus den letzten 24 Stunden, zum Beispiel zu Produkten, Finanzierung oder Partnerschaften.",l:"Mit Hintergrund und Einordnung, falls die Meldung ein mehrtägiges Thema ist, nur das Neue.",src:"Beispielquelle E",t:"03:20"}]},
{id:"wissenschaft",name:"Wissenschaft",items:[
 {sub:"Raumfahrt und Natur",h:"Beispielmeldung: Neue Aufnahmen eines fernen Sternhaufens",s:"Ein Teleskop liefert ungewöhnlich scharfe Bilder. Forscher wollen daraus die Sternentstehung genauer ableiten.",l:"Der Langtext erklärt die Messmethode und was die Daten über die Entwicklung von Galaxien verraten.",src:"Beispielquelle F",t:"02:50"},
 {sub:"Medizin und Gesundheit",h:"Beispielmeldung: Studie zu Schlaf und Gedächtnis",s:"Eine Untersuchung findet einen Zusammenhang zwischen Tiefschlaf und Lernleistung.",l:"Mit Angaben zu Stichprobe, Grenzen der Studie und Reaktionen anderer Forscher.",src:"Beispielquelle G",t:"01:30",unc:1}]},
{id:"informatik",name:"Informatik",items:[
 {sub:"Open Source",h:"Beispielmeldung: Neue Version eines Linux-Werkzeugs erschienen",s:"Das Update bringt bessere Leistung und behebt mehrere Fehler.",l:"Die wichtigsten Änderungen im Überblick und was beim Update zu beachten ist.",src:"Beispielquelle H",t:"06:00"},
 {sub:"Sicherheit und Datenschutz",h:"Beispielmeldung: Sicherheitslücke in verbreiteter Software geschlossen",s:"Ein Patch steht bereit. Nutzer sollten das Update zeitnah einspielen.",l:"Der Langtext erläutert, wer betroffen war und wie die Lücke gefunden wurde.",src:"Beispielquelle I",t:"23:15"}]},
{id:"ki",name:"KI",items:[
 {sub:"Neue Modelle und Releases",h:"Beispielmeldung: Neues Sprachmodell vorgestellt",s:"Der Anbieter nennt Verbesserungen bei Schlussfolgern und Programmieren.",l:"Mit Einordnung der Benchmark-Angaben und ihrer Aussagekraft.",src:"Beispielquelle J",t:"05:05"},
 {sub:"Regulierung und Gesellschaft",h:"Beispielmeldung: EU konkretisiert Regeln für KI-Systeme",s:"Neue Leitlinien sollen die Umsetzung der Vorgaben erleichtern.",l:"Welche Pflichten für wen gelten und ab wann.",src:"Beispielquelle K",t:"00:40"}]},
{id:"knobel",name:"Knobelecke",items:[
 {sub:"Rätsel des Tages",h:"Städte ohne Häuser",s:"Ich habe Städte, aber keine Häuser, Wälder, aber keine Bäume, und Wasser, aber keine Fische. Was bin ich?",sol:"Eine Landkarte."}]},
{id:"wissen",name:"Wissensecke",items:[
 {sub:"Natur",h:"Honig verdirbt praktisch nicht",s:"Wegen seines geringen Wassergehalts und seiner Säure können Mikroorganismen darin kaum wachsen. Er bleibt über Jahrzehnte genießbar."},
 {sub:"Astronomie",h:"Ein Tag auf der Venus dauert länger als ihr Jahr",s:"Die Venus dreht sich so langsam um sich selbst, dass eine Drehung länger dauert als ein Umlauf um die Sonne."}]},
{id:"vermischtes",name:"Vermischtes",items:[
 {sub:"Kurioses",h:"Beispielmeldung: Gemeinde sucht den Besitzer eines Riesenkürbis",s:"Ein Kürbis von über 200 Kilo wurde herrenlos am Ortsrand gefunden.",src:"Beispielquelle L",t:"07:00"},
 {sub:"Kleinigkeit",h:"Beispielmeldung: Zugverbindung wird wieder aufgenommen",s:"Nach langer Pause fährt die Strecke ab Dezember wieder.",src:"Beispielquelle M",t:"06:10"}]}
]};

const X={politik:[{sub:"Europa",h:"Beispielmeldung: Mitgliedstaaten einigen sich auf Energiepaket",s:"Die Minister legen sich auf gemeinsame Ziele für den Ausbau der Netze fest.",l:"Hintergrund zu Kosten, Zeitplan und den Positionen einzelner Länder.",src:"Beispielquelle N",t:"03:45"},{sub:"Deutschland",h:"Beispielmeldung: Länder fordern mehr Geld für Schulen",s:"Die Kultusminister verlangen eine Beteiligung des Bundes an den Digitalisierungskosten.",l:"Der Langtext fasst die Forderungen und die bisherige Finanzierung zusammen.",src:"Beispielquelle O",t:"02:10"}],wissenschaft:[{sub:"Forschung und Entdeckungen",h:"Beispielmeldung: Forscher entdecken neue Tiefsee-Art",s:"Ein Tauchroboter hat in großer Tiefe eine bisher unbekannte Art gefilmt.",l:"Wie die Art entdeckt wurde und was sie über das Ökosystem verrät.",src:"Beispielquelle P",t:"01:00"}],informatik:[{sub:"Software und Entwicklung",h:"Beispielmeldung: Neue Version einer Programmiersprache veröffentlicht",s:"Das Release bringt neue Sprachfunktionen und schnellere Builds.",l:"Die wichtigsten Änderungen für Entwickler im Überblick.",src:"Beispielquelle Q",t:"05:30"}],ki:[{sub:"Tools und Anwendungen",h:"Beispielmeldung: Neues KI-Werkzeug für Programmierer vorgestellt",s:"Das Tool übernimmt Routineaufgaben direkt im Editor.",l:"Was es kann, was es kostet und wo die Grenzen liegen.",src:"Beispielquelle R",t:"04:20"}],wissen:[{sub:"Körper",h:"Oktopusse haben drei Herzen",s:"Zwei pumpen Blut durch die Kiemen, das dritte versorgt den restlichen Körper."},{sub:"Alltag",h:"Bananen sind leicht radioaktiv",s:"Sie enthalten Kalium, von dem ein winziger Teil natürlich radioaktiv ist. Die Dosis ist völlig harmlos."}],vermischtes:[{sub:"Kurioses",h:"Beispielmeldung: Hund findet verlorenen Ehering im Garten",s:"Nach zwei Jahren tauchte der Ring beim Buddeln wieder auf.",src:"Beispielquelle S",t:"07:30"}]};
DAY.topics.forEach(t=>t.items.push(...(X[t.id]||[])));
const $=s=>document.querySelector(s), P=$('#pages');
const fmt=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function build(){
  const brief=DAY.topics.filter(t=>t.id!=='knobel'&&t.id!=='wissen'&&t.id!=='vermischtes').map(t=>`<li><a data-go="${t.id}">${t.items[0].h.replace('Beispielmeldung: ','')}</a></li>`).join('');
  let h=`<section class="brief"><h2>Das Wichtigste in 60 Sekunden</h2><ol>${brief}</ol></section><p class="note">Prototyp mit Beispieldaten. Die Texte sind Platzhalter, nur Layout und Bedienung sind echt.</p>`;
  for(const t of DAY.topics){
    h+=`<h2 class="topic" id="t-${t.id}">${t.name}</h2>`;
    t.items.forEach(i=>{
      h+=`<article class="a"><div class="sub">${i.sub}</div><button class="hd" aria-expanded="false"><h3>${i.h}</h3><span class="chev" aria-hidden="true">+</span></button><div class="body" hidden><p>${i.s}</p>`;
      if(i.sol)h+=`<button class="sol" aria-expanded="false">Lösung zeigen</button><p class="solt" hidden><strong>${i.sol}</strong></p>`;
      if(i.l)h+=`<button class="more" aria-expanded="false">Mehr lesen</button><div class="long" hidden><p>${i.l}</p></div>`;
      if(i.src)h+=`<p class="meta">${i.src}, ${i.t} Uhr${i.unc?'<span class="unc">unbestätigt</span>':''}</p>`;
      h+=`</div></article>`;
    });
  }
  h+=`<p class="note">Erstellt um ${DAY.created} Uhr. Zeitraum: ${DAY.window}.</p>`;
  P.innerHTML=h;
  $('#tabs').innerHTML=DAY.topics.map(t=>`<button data-go="${t.id}">${t.name}</button>`).join('');
  $('#stamp').textContent=fmt.format(new Date(DAY.date+'T12:00:00'))+', erstellt um '+DAY.created+' Uhr';
  $('#dbtn').textContent='Datum';$('#tbtn').textContent='Hell/Dunkel';
}
const gapPx=()=>parseFloat(getComputedStyle(P).columnGap)||0;
const stride=()=>P.clientWidth+gapPx();
const total=()=>Math.max(1,Math.round((P.scrollWidth+gapPx())/stride()));
const cur=()=>Math.round(P.scrollLeft/stride());
const goPage=i=>P.scrollTo({left:Math.max(0,Math.min(i,total()-1))*stride(),behavior:'smooth'});
const pageOf=el=>Math.floor((el.offsetLeft+4)/stride());

let forced=null,wheelT=0;
function sync(){
  const c=cur(),n=total();
  $('#pg').textContent=`Seite ${c+1} von ${n}`;
  $('#prev').disabled=c<=0;$('#next').disabled=c>=n-1;
  if(forced&&forced.page!==c){}
  let act=DAY.topics[0].id;
  for(const t of DAY.topics){if(pageOf($('#t-'+t.id))<=c)act=t.id}
  if(forced)act=forced.id;
  document.querySelectorAll('#tabs button').forEach(b=>{const on=b.dataset.go===act;b.setAttribute('aria-current',on);if(on)b.scrollIntoView({inline:'nearest',block:'nearest'})});
}
let snapT;
P.addEventListener('scroll',()=>{sync();clearTimeout(snapT);snapT=setTimeout(()=>{const target=cur()*stride();if(Math.abs(P.scrollLeft-target)>2)P.scrollTo({left:target,behavior:'smooth'})},120)},{passive:true});
addEventListener('resize',()=>{goPage(cur());sync()});

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const pgi=pageOf($('#t-'+g.dataset.go));forced={id:g.dataset.go,page:pgi};goPage(pgi);setTimeout(sync,50);return}
  const hd=e.target.closest('.hd');
  if(hd){const o=hd.getAttribute('aria-expanded')!=='true';hd.setAttribute('aria-expanded',o);hd.nextElementSibling.hidden=!o;sync();return}
  const m=e.target.closest('.more');
  if(m){const o=m.getAttribute('aria-expanded')!=='true';m.setAttribute('aria-expanded',o);m.textContent=o?'Weniger':'Mehr lesen';m.nextElementSibling.hidden=!o;sync();return}
  const s=e.target.closest('.sol');
  if(s){const o=s.getAttribute('aria-expanded')!=='true';s.setAttribute('aria-expanded',o);s.textContent=o?'Lösung verbergen':'Lösung zeigen';s.nextElementSibling.hidden=!o;return}
  if(!e.target.closest('.cal')&&e.target.id!=='dbtn'){$('#cal').hidden=true;$('#dbtn').setAttribute('aria-expanded','false')}
});
$('#prev').onclick=()=>{forced=null;goPage(cur()-1)};$('#next').onclick=()=>{forced=null;goPage(cur()+1)};
P.addEventListener('touchstart',()=>{forced=null},{passive:true});
P.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<Math.abs(e.deltaX))return;e.preventDefault();forced=null;const n=Date.now();if(n-wheelT<450)return;wheelT=n;if(Math.abs(e.deltaY)>4)goPage(cur()+(e.deltaY>0?1:-1))},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape'){$('#cal').hidden=true;$('#dbtn').setAttribute('aria-expanded','false')}if(e.target.closest('button'))return;forced=null;if(e.key==='ArrowRight')goPage(cur()+1);if(e.key==='ArrowLeft')goPage(cur()-1)});

// Kalender: markiert vorhandene Tage, Beispiel für November 2026
let selDay=22;
function drawCal(){
  const first=6,days=30,wd=['Mo','Di','Mi','Do','Fr','Sa','So'];
  let h='<h4><span>November 2026</span></h4><div class="g">'+wd.map(d=>`<span>${d}</span>`).join('')+'<i></i>'.repeat(first);
  for(let d=1;d<=days;d++){const has=DAY.available.includes(d);h+=`<button class="d${has?' has':''}${d===selDay?' sel':''}" data-d="${d}" ${has?'':'disabled'}>${d}</button>`}
  $('#cal').innerHTML=h+'</div><p>Markierte Tage haben ein Briefing. Im Prototyp ändert sich nur das Datum.</p>';
}
$('#dbtn').onclick=e=>{const c=$('#cal');c.hidden=!c.hidden;$('#dbtn').setAttribute('aria-expanded',!c.hidden);if(!c.hidden)drawCal()};
$('#cal').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b||b.disabled)return;selDay=+b.dataset.d;
  $('#stamp').textContent=fmt.format(new Date(2026,10,selDay,12))+', erstellt um '+DAY.created+' Uhr';$('#cal').hidden=true;$('#dbtn').setAttribute('aria-expanded','false')});

$('#tbtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;const v=dark?'light':'dark';r.dataset.theme=v;store.set('theme',v)};
const saved=store.get('theme');if(saved)document.documentElement.dataset.theme=saved;

build();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(sync);
sync();
</script>
</body>
</html>
